[project]
name = "profitlens"
version = "0.1.0"
description = "Evidence-grounded advertising profit RCA engine"
requires-python = ">=3.12"
dependencies = [
  "asyncmy>=0.2,<1",
  "clickhouse-connect>=0.8,<1",
  "fastapi>=0.116,<1",
  "langgraph>=1,<2",
  "numpy>=2.2,<3",
  "openai>=2,<3",
  "polars>=1.32,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "sqlglot>=27,<29",
  "uvicorn>=0.35,<1",
]

[project.scripts]
profitlens = "ad_rca.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ad_rca"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
